<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>在线弹钢琴 · Piano Play</title>
<style>html{background:#f5f5f7}</style>
<link rel="stylesheet" href="./src/style.css">
</head>
<body>
<div class="app">
  <div class="workspace">
    <aside class="sidebar">
      <div class="brand"><div class="brand-mark">♪</div><div><h1>在线弹钢琴</h1><p>Piano Play · Keyboard Game</p></div></div>
      <div class="library-head"><div class="library-title"><span>曲目</span><span id="songCount"></span></div><div class="search"><input id="search" placeholder="搜索曲目" /></div></div>
      <div class="cats" id="cats"></div>
      <div class="song-list" id="songList"></div>
      </aside>

    <main class="main">
      <section class="now-card">
        <div class="album">♫</div>
        <div class="song-head">
          <h2 id="title">在线弹钢琴</h2>
          <div class="meta-line"><span id="composer"></span><span>·</span><span id="desc"></span></div>
        </div>
        <div class="song-stats"><span class="stat-chip" id="source"></span><span class="stat-chip stars" id="stars"></span><span class="stat-chip" id="progressText"></span></div>
        <div class="head-actions"><button class="soft-btn" id="restartBtn">↻ 重来</button><button class="soft-btn primary" id="demoBtn">▶ 试听</button></div>
      </section>

      <div class="center">
        <section class="practice">
          <div class="practice-toolbar">
            <button class="mode-pill active" id="guideMode">跟练模式</button><button class="mode-pill" id="rhythmMode">音游模式</button>
            <select class="section-select" id="sectionSelect" title="完整乐谱 / 跳转段落"></select>
            <span class="spacer"></span><span class="audio-status" id="audioStatus">点击琴键后加载钢琴音色</span>
          </div>
          <div class="score-shell">
            <div class="score-window" id="score"></div>
            <div class="rhythm-shell" id="rhythmShell">
              <div class="rhythm-hud">
                <div class="hud-stat"><span>Score</span><b id="rhythmScore">000000</b></div>
                <div class="rhythm-combo"><b id="rhythmCombo">0</b><span>COMBO</span></div>
                <div class="hud-stat"><span>Accuracy</span><b id="rhythmAcc">100.0%</b></div>
              </div>
              <div class="rhythm-stage" id="rhythmStage">
                <div class="rhythm-progress"><i id="rhythmProgressBar"></i></div>
                <div class="rhythm-field" id="rhythmField">
                  <div class="rhythm-lane" data-key="A"><button class="rhythm-pad lane-pad" aria-label="A轨">A</button></div>
                  <div class="rhythm-lane" data-key="S"><button class="rhythm-pad lane-pad" aria-label="S轨">S</button></div>
                  <div class="rhythm-lane" data-key="D"><button class="rhythm-pad lane-pad" aria-label="D轨">D</button></div>
                  <div class="rhythm-lane" data-key="J"><button class="rhythm-pad lane-pad" aria-label="J轨">J</button></div>
                  <div class="rhythm-lane" data-key="K"><button class="rhythm-pad lane-pad" aria-label="K轨">K</button></div>
                  <div class="rhythm-lane" data-key="L"><button class="rhythm-pad lane-pad" aria-label="L轨">L</button></div>
                </div>
                <div class="rhythm-line"></div>
                <div class="rhythm-judgement" id="rhythmJudgement"></div>
                <div class="rhythm-countdown" id="rhythmCountdown"></div>
                <div class="rhythm-result" id="rhythmResult"></div>
              </div>
              <div class="rhythm-footer">
                <div class="rhythm-caption">天空之城 · 92 BPM · 固定六键节奏实验</div>
                <div class="rhythm-actions"><button id="rhythmStart">开始</button><button id="rhythmPause">暂停</button></div>
              </div>
            </div>
            <div class="current-key"><small>下一键</small><span class="press-label">按</span><b id="expected">—</b><span id="expectedNote" class="current-note">—</span></div>
          </div>
          <div class="statusbar"><span>进度 <b id="progress">0 / 0</b></span><span>模式 <b id="modeText">跟练模式</b></span><span class="kbd-help">整首乐谱连续显示 · 按对自动前进 · 无时间限制</span></div>
        </section>
      </div>

      <section class="piano-card">
        <div class="piano-top">
          <div class="piano-title"><b>演奏区</b><span>按提示键演奏 · 你控制节奏</span></div>
          <div class="keyboard-map"><span class="mini-key">白键 A–X</span><span class="mini-key">黑键 1–0 / 符号</span><span class="mini-key em">高音 Shift + A / S / D…</span></div>
        </div>
        <div class="piano-scroll"><div class="piano" id="piano"></div></div>
      </section>
    </main>
  </div>
</div>


<script type="module" src="./src/main.js"></script>
</body>
</html>
